name: EverythingAI Phase 5 Closure Qualification

on:
  pull_request:
    paths:
      - 'services/api/src/governance/**'
      - 'services/api/test/phase5*.test.js'
      - 'services/api/docs/phase5-*.md'
      - 'REPORTS/ISSUE-*-PHASE5-*.md'
      - 'docs/ADR-005-013_GOVERNANCE_SESSION_HANDOVER_CONTINUITY.md'
      - 'docs/GOVERNANCE_HANDOVER_TEMPLATE.md'
      - 'docs/PHASE5_*.md'
      - 'docs/HANDOVER_*PHASE5*.json'
      - 'scripts/validate-governance-continuity.mjs'
      - 'scripts/validate-phase5-closure.mjs'
      - '.github/workflows/ci-governance-continuity.yml'
      - '.github/workflows/ci-phase5-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies exactly
        working-directory: services/api
        run: npm ci
      - name: Validate Phase 5 closure artifact baseline
        run: node scripts/validate-phase5-closure.mjs
      - name: Validate governance continuity
        run: node scripts/validate-governance-continuity.mjs
      - name: Run complete Phase 5 governance test stack
        working-directory: services/api
        run: >-
          node --test
          test/phase5IdentityFoundation.test.js
          test/phase5PermissionFoundation.test.js
          test/phase5PolicyEngineFoundation.test.js
          test/phase5RiskClassificationFoundation.test.js
          test/phase5ApprovalWorkflowFoundation.test.js
          test/phase5EscalationGovernanceFoundation.test.js
          test/phase5AuthorizationDecisionLayer.test.js
          test/phase5ControlledEnforcementActivation.test.js
