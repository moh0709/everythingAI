name: EverythingAI Enterprise Backup Restore Validation

on:
  pull_request:
    paths:
      - 'services/api/package-lock.json'
      - 'PROJECT_STATE.md'
      - 'AI_BOOTSTRAP.md'
      - 'docs/ROADMAP.md'
      - 'docs/ENTERPRISE_READINESS_FOUNDATION_RELEASE_DECISION_*.md'
      - 'docs/HANDOVER_*ENTERPRISE_READINESS_FOUNDATION_RELEASE.json'
      - 'services/api/src/enterprise/**'
      - 'services/api/test/enterpriseBackupRestoreValidation.test.js'
      - '.github/workflows/ci-enterprise-backup-restore-validation.yml'
  workflow_dispatch:

jobs:
  enterprise-backup-restore-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --test test/enterpriseBackupRestoreValidation.test.js
