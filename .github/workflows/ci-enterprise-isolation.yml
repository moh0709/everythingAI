name: EverythingAI Enterprise Isolation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  enterprise-isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: services/api
        run: npm ci

      - name: Run enterprise isolation acceptance
        working-directory: services/api
        run: node --test test/enterpriseIsolation.test.js
