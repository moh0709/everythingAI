name: EverythingAI Phase 7 Foundation Closure Qualification

on:
  pull_request:
    paths:
      - 'services/api/src/archive/**'
      - 'services/api/src/db/archiveProfileRepository.js'
      - 'services/api/test/archive*.test.js'
      - 'services/api/test/metadataSidecar.test.js'
      - 'apps/everything-ai-ui/src/admin/archiveReviewModel.ts'
      - 'apps/everything-ai-ui/src/admin/components/ArchiveReviewWorkspace.tsx'
      - 'apps/everything-ai-ui/src/admin/components/index.ts'
      - 'PROJECT_STATE.md'
      - 'AI_BOOTSTRAP.md'
      - 'docs/ROADMAP.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/PHASE7_*.md'
      - 'docs/HANDOVER_*PHASE7*.json'
      - 'scripts/validate-phase7-foundation-closure.mjs'
      - '.github/workflows/ci-phase7-foundation-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7-foundation-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies exactly
        working-directory: services/api
        run: npm ci
      - name: Validate Phase 7 foundation closure artifacts
        run: node scripts/validate-phase7-foundation-closure.mjs
      - name: Run Phase 7 focused archive qualification stack
        working-directory: services/api
        run: >-
          node --test
          test/archiveProfileModel.test.js
          test/archivePlanner.test.js
          test/archiveExecutor.test.js
          test/metadataSidecar.test.js
      - name: Install frontend dependencies exactly
        working-directory: apps/everything-ai-ui
        run: npm ci
      - name: Typecheck Admin review workspace
        working-directory: apps/everything-ai-ui
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/everything-ai-ui
        run: npm run build
