name: EverythingAI Dependency Security Audit

on:
  pull_request:
    paths:
      - 'services/api/package.json'
      - 'services/api/package-lock.json'
      - 'scripts/preproduction/**'
      - 'services/api/test/preProductionRecoveryQualification.test.js'
      - '.github/workflows/ci-preproduction-recovery-qualification.yml'
      - '.github/workflows/ci-dependency-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install exact backend dependencies
        run: npm ci
      - name: Generate audited remediation
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install express@5.2.1 --save --package-lock-only --ignore-scripts
          npm audit --json
      - name: Commit exact generated dependency state to Phase 4 branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency state already matches audited remediation."
            exit 0
          fi
          git config user.name "EverythingAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate backend dependency advisories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
