name: EverythingAI Dependency Security Audit

on:
  pull_request:
    paths:
      - 'services/api/package.json'
      - 'services/api/package-lock.json'
      - '.github/workflows/ci-dependency-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install exact backend dependencies
        run: npm ci
      - name: Capture baseline dependency audit
        continue-on-error: true
        run: npm audit --json
      - name: Apply bounded lockfile remediation
        run: npm audit fix --package-lock-only
      - name: Verify remediated dependency audit
        run: npm audit --json
      - name: Commit remediated lockfile on remediation PR
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
        working-directory: .
        run: |
          git add services/api/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile remediation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remediate backend dependency vulnerabilities"
          git push origin HEAD:${{ github.head_ref }}
