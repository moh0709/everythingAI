name: EverythingAI Dependency Security Audit

on:
  pull_request:
    paths:
      - 'services/api/package.json'
      - 'services/api/package-lock.json'
      - 'scripts/preproduction/**'
      - 'services/api/test/preProductionRecoveryQualification.test.js'
      - '.github/workflows/ci-preproduction-recovery-qualification.yml'
      - '.github/workflows/ci-dependency-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Install exact backend dependencies
        run: npm ci
      - name: Generate remediated dependency candidate
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          npm install express@5.2.1 --save --package-lock-only --ignore-scripts
      - name: Audit remediation candidate
        run: npm audit --json
      - name: Upload remediated dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: backend-remediated-dependencies
          path: |
            services/api/package.json
            services/api/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore repository dependency files before authoritative audit
        run: git checkout -- package.json package-lock.json
      - name: Audit exact backend dependency lock
        run: npm audit --json
