name: EverythingAI Enterprise Runtime Health

on:
  pull_request:
    paths:
      - 'services/api/src/enterprise/**'
      - 'services/api/src/server.js'
      - 'services/api/test/enterpriseRuntimeHealth.test.js'
      - '.github/workflows/ci-enterprise-runtime-health.yml'
  workflow_dispatch:

jobs:
  enterprise-runtime-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: node --test test/enterpriseRuntimeHealth.test.js
