name: EverythingAI Phase 10 Advanced Document Intelligence Research Qualification

on:
  pull_request:
    paths:
      - 'REPORTS/EAI-PHASE10-*.md'
      - 'docs/PHASE10_*.md'
      - 'docs/HANDOVER_*PHASE10*.json'
      - 'scripts/validate-phase10-document-intelligence-research.mjs'
      - '.github/workflows/ci-phase10-document-intelligence-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10-document-intelligence-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Phase 10 research evidence and authority boundary
        run: node scripts/validate-phase10-document-intelligence-research.mjs
