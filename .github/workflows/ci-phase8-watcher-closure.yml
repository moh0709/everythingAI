name: EverythingAI Phase 8 Watcher Stale Preview Closure Qualification

on:
  pull_request:
    paths:
      - 'services/api/src/archive/archiveStaleState.js'
      - 'services/api/src/archive/archiveWatchAdapter.js'
      - 'services/api/src/archive/archiveUpdatePreview.js'
      - 'services/api/src/watcher/watchService.js'
      - 'services/api/test/archiveStaleState.test.js'
      - 'services/api/test/archiveWatchAdapter.test.js'
      - 'services/api/test/watcherArchiveIntegration.test.js'
      - 'services/api/test/archiveUpdatePreview.test.js'
      - 'apps/everything-ai-ui/src/admin/archiveReviewModel.ts'
      - 'apps/everything-ai-ui/src/admin/components/ArchiveReviewWorkspace.tsx'
      - 'tests/archive-review-stale-model.test.mjs'
      - 'docs/PHASE8_*.md'
      - 'docs/HANDOVER_*PHASE8*.json'
      - 'scripts/validate-phase8-watcher-closure.mjs'
      - '.github/workflows/ci-phase8-watcher-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase8-watcher-stale-preview-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies exactly
        working-directory: services/api
        run: npm ci
      - name: Validate Phase 8 closure artifacts and authority boundary
        run: node scripts/validate-phase8-watcher-closure.mjs
      - name: Run Phase 8 focused backend qualification stack
        working-directory: services/api
        run: >-
          node --test
          test/archiveStaleState.test.js
          test/archiveWatchAdapter.test.js
          test/watcherArchiveIntegration.test.js
          test/archiveUpdatePreview.test.js
      - name: Run Admin stale review model qualification
        run: node --test tests/archive-review-stale-model.test.mjs
      - name: Install frontend dependencies exactly
        working-directory: apps/everything-ai-ui
        run: npm ci
      - name: Typecheck Admin stale review surface
        working-directory: apps/everything-ai-ui
        run: npm run typecheck
      - name: Build frontend
        working-directory: apps/everything-ai-ui
        run: npm run build
