name: EverythingAI Governance Continuity

on:
  pull_request:
    paths:
      - 'docs/ADR-005-013_GOVERNANCE_SESSION_HANDOVER_CONTINUITY.md'
      - 'docs/GOVERNANCE_HANDOVER_TEMPLATE.md'
      - 'docs/GOVERNANCE_HANDOVER_*.md'
      - 'scripts/validate-governance-continuity.mjs'
      - '.github/workflows/ci-governance-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate governance continuity baseline
        run: node scripts/validate-governance-continuity.mjs
