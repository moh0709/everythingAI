name: EverythingAI CI Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  root-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run root regression
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/everything-ai-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/everything-ai-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  playwright-smoke:
    runs-on: ubuntu-latest

    needs:
      - root-regression
      - backend-tests
      - frontend-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: services/api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/everything-ai-ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/everything-ai-ui
        run: npx playwright install --with-deps chromium

      - name: Start backend API
        working-directory: services/api
        run: |
          nohup npm start > ../../backend-ci.log 2>&1 &
          echo $! > ../../backend.pid

      - name: Wait for backend API
        run: |
          STATUS="000"

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4100/api/status || true)

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Backend ready (HTTP $STATUS)"
              exit 0
            fi

            sleep 1
          done

          echo "Backend failed to start. Last HTTP status: $STATUS"
          cat backend-ci.log || true
          exit 1

      - name: Start frontend dev server
        working-directory: apps/everything-ai-ui
        run: |
          nohup npm run dev -- --host 127.0.0.1 > ../../frontend-ci.log 2>&1 &
          echo $! > ../../frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5151 >/dev/null; then
              echo "Frontend ready"
              exit 0
            fi

            sleep 1
          done

          echo "Frontend failed to start"
          cat frontend-ci.log || true
          exit 1

      - name: Run Client/Admin smoke tests
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/client-admin-smoke.spec.ts

      - name: Run Phase 2 rich citation acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/rich-citation-source-highlighting.spec.ts

      - name: Run Phase 2 long-form and table formatting acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/long-form-table-formatting.spec.ts

      - name: Run Phase 2 grouped planning and bulk-selection acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/grouped-planning-bulk-selection.spec.ts

      - name: Run Phase 2 API key lifecycle acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/api-key-lifecycle.spec.ts

      - name: Run Product Depth explainable search acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/explainable-unified-search.spec.ts

      - name: Run Product Depth contextual snippet acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/contextual-search-snippets.spec.ts

      - name: Run Product Depth Knowledge Base search navigation acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/knowledge-search-navigation.spec.ts

      - name: Run Product Depth source inspection navigation acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/source-inspection-navigation.spec.ts

      - name: Run disposable-folder RC acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/disposable-folder-acceptance.spec.ts

      - name: Run UI-governed action and undo acceptance
        working-directory: apps/everything-ai-ui
        env:
          EVERYTHINGAI_API_URL: http://127.0.0.1:4100
          EVERYTHINGAI_UI_URL: http://127.0.0.1:5151
          EVERYTHINGAI_SMOKE_ARTIFACT_DIR: smoke-artifacts/everythingai-smoke
        run: npx playwright test smoke/ui-governed-action-undo.spec.ts

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: backend-ci.log
          if-no-files-found: ignore

      - name: Upload frontend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-log
          path: frontend-ci.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/everything-ai-ui/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            apps/everything-ai-ui/test-results
            apps/everything-ai-ui/smoke-artifacts
          if-no-files-found: ignore
